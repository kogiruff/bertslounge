<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Commission admin | Bert's Lounge</title>
  <link rel="stylesheet" href="admin.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <main class="panel">
    <header>
      <h1>Commission admin</h1>
      <p>Manage public commission availability.</p>
    </header>

    <section id="login-panel" class="card">
      <h2>Sign in</h2>
      <p>Use an approved Google account to continue.</p>
      <div id="google-signin"></div>
    </section>

    <section id="admin-panel" class="card hidden">
      <!-- Tombol Logout kita jadikan absolute di CSS agar ada di pojok -->
      <button id="logout-btn" class="logout-btn" type="button">Sign out</button>

      <h2>Availability</h2>
      <p id="status-text" aria-live="polite" style="display: none;">Loading…</p>
      
      <div class="toggle-wrapper">
        <label class="toggle">
          <input id="commission-toggle" type="checkbox" />
          <span class="slider round"></span>
        </label>
        <strong id="toggle-label" class="status-closed">Closed</strong>
      </div>

      <div class="actions">
        <button id="save-status" class="save-btn" type="button">Save status</button>
      </div>
    </section>
  </main>

  <!-- Popup Alert / Toast -->
  <div id="message" class="toast" role="status"></div>
</body>
</html>
