<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><title>Commission admin | Bert's Lounge</title><link rel="stylesheet" href="admin.css" /><script src="https://accounts.google.com/gsi/client" async defer></script><script src="admin.js" defer></script></head>
<body><main class="panel"><header><p class="eyebrow">Bert's Lounge</p><h1>Commission admin</h1><p>Manage public commission availability.</p></header><section id="login-panel" class="card"><h2>Sign in</h2><p>Use an approved Google account to continue.</p><div id="google-signin"></div></section><section id="admin-panel" class="card hidden"><h2>Availability</h2><p id="status-text" aria-live="polite">Loading…</p><label class="toggle"><input id="commission-toggle" type="checkbox" /><span aria-hidden="true"></span><strong id="toggle-label">Commission is closed</strong></label><p class="meta">Signed in as: <span id="admin-email">—</span></p><div class="actions"><button id="save-status" class="primary" type="button">Save status</button><button id="logout-btn" class="secondary" type="button">Sign out</button></div></section><div id="message" class="alert hidden" role="status"></div></main></body></html>
